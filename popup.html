<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinFix</title>
    <style>
        html {
            width: 380px;
            /* Increased height to fit the new button */
            height: 340px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 25px;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #eee;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: 700;
            color: #111;
        }

        p {
            font-size: 14px;
            line-height: 1.5;
            color: #666;
            margin-bottom: 20px;
            margin-top: 0;
        }

        /* Shared button styles */
        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 0;
            color: #fff;
            text-decoration: none;
            border-radius: 24px;
            transition: all 0.2s ease;
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            margin-bottom: 10px; /* Add spacing between buttons */
        }

        .action-button:hover {
            transform: translateY(-1px);
        }

        .action-button:last-of-type {
            margin-bottom: 0;
        }

        /* GitHub Button specific */
        .github-button {
            background-color: #c8232c; /* Pinterest Red */
        }

        .github-button:hover {
            background-color: #ad081b;
            box-shadow: 0 4px 8px rgba(200, 35, 44, 0.2);
        }

        /* Rate Button specific */
        .rate-button {
            background-color: #4285F4;
        }

        .rate-button:hover {
            background-color: #3367D6;
            box-shadow: 0 4px 8px rgba(66, 133, 244, 0.2);
        }

        .button-icon {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .divider {
            height: 1px;
            background-color: #eee;
            margin: 20px 0;
            width: 100%;
        }

        .contact {
            font-size: 13px;
            color: #888;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .contact a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            transition: color 0.2s;
        }

        .contact a:hover {
            color: #c8232c;
            text-decoration: underline;
        }

        .footer-note {
            font-size: 11px;
            color: #aaa;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>PinFix is Active</h1>
        <p>Have a happy Pinning.<br>Built with ❤️</p>

        <a href="https://github.com/WeirdCatAFK/PinFix" target="_blank" class="action-button github-button">
            <svg class="button-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
            </svg>
            View Source on GitHub
        </a>

        <a href="https://chromewebstore.google.com/detail/pinfix/mifjdganjoacabfepgbdeocbogmmhccn/reviews" target="_blank" class="action-button rate-button">
            <svg class="button-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
            Rate on Web Store
        </a>

        <div class="divider"></div>

        <div class="contact">
            <div>Say Hi: <a href="mailto:dpineda.dev@gmail.com">dpineda.dev@gmail.com</a></div>
            <div>X / Twitter: <a href="https://twitter.com/WeirdCat_AFK" target="_blank">@WeirdCat_AFK</a></div>
        </div>

        <div class="footer-note">Check out my other projects!</div>
    </div>
</body>

</html>
